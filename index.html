<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --ink: #1d1b18; --muted: #7a746b;
    --line: #e4ded4; --accent: #2f6fdf; --flash: #ff3fa4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16150f; --panel: #211f19; --ink: #ece7dd; --muted: #9a9387; --line: #34312a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  .stat { color: var(--muted); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .board { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .wrap { position: relative; width: 100%; }
  canvas { display: block; width: 100%; image-rendering: pixelated; cursor: crosshair; border-radius: 4px; }
  .tools { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .swatch { width: 24px; height: 24px; border-radius: 5px; border: 2px solid var(--line); cursor: pointer; position: relative; }
  .swatch.on { border-color: var(--ink); transform: scale(1.12); }
  .swatch span { position: absolute; inset: auto 0 -16px; text-align: center; font: 10px ui-monospace, monospace; color: var(--muted); }
  input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #hover { font: 12px ui-monospace, monospace; color: var(--muted); min-width: 110px; }
  aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .player { display: flex; justify-content: space-between; padding: 3px 0; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 2px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  #log { max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ev { padding-bottom: 6px; border-bottom: 1px dashed var(--line); word-wrap: break-word; }
  .ev .who { font-weight: 600; }
  .ev .meta { color: var(--muted); font-size: 12px; }
  .ev.turn { color: var(--muted); font-size: 12px; text-align: center; border: 0; }
  .dots { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
  .dots i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  #err { color: #e23b3b; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>Our Story</h1>
  <span class="stat">turn <b id="turn">–</b></span>
  <span class="stat"><b id="left">–</b>s left</span>
  <span class="stat"><b id="ppt">–</b> pixels per player per turn</span>
</header>
<main>
  <section class="board">
    <div class="wrap"><canvas id="cv"></canvas></div>
    <div class="tools" id="palette"></div>
    <div class="tools" style="margin-top:22px">
      <input id="name" placeholder="your name" size="10">
      <span class="stat">pending <b id="pending">0</b></span>
      <button class="primary" id="send">Place</button>
      <button id="clear">Clear pending</button>
      <button id="done">End my turn</button>
      <span id="hover"></span>
    </div>
    <div class="tools">
      <input id="say" placeholder="say something to the other players" style="flex:1">
      <button id="sayBtn">Say</button>
    </div>
    <div id="err"></div>
  </section>
  <aside>
    <div class="card"><h2>Players</h2><div id="players"><span class="stat">nobody yet</span></div></div>
    <div class="card"><h2>Story so far</h2><div id="log"></div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, color = "r", pending = [], hover = null, lastLogLen = 0, flashes = [];
try { $("name").value = localStorage.getItem("ourstory-name") || ""; } catch (e) {}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function buildPalette() {
  const p = $("palette"); p.innerHTML = "";
  for (const [k, hex] of Object.entries(S.palette).concat([[".", null]])) {
    const d = document.createElement("div");
    d.className = "swatch" + (k === color ? " on" : "");
    d.style.background = hex || "repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/8px 8px";
    d.title = k === "." ? "erase" : k;
    d.innerHTML = `<span>${k}</span>`;
    d.onclick = () => { color = k; buildPalette(); };
    p.appendChild(d);
  }
}

function draw() {
  if (!S) return;
  const W = S.width, H = S.height, css = cv.clientWidth, cell = Math.floor(css * devicePixelRatio / W);
  cv.width = W * cell; cv.height = H * cell;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  ctx.fillStyle = dark ? "#2a2721" : "#fbfaf7"; ctx.fillRect(0, 0, cv.width, cv.height);
  S.grid.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== S.empty) { ctx.fillStyle = S.palette[c]; ctx.fillRect(x * cell, y * cell, cell, cell); }
  }));
  ctx.strokeStyle = dark ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.05)"; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, cv.height); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(cv.width, y * cell + .5); ctx.stroke(); }
  const now = performance.now();
  flashes = flashes.filter(f => now - f.t < 2500);
  for (const f of flashes) {
    ctx.strokeStyle = `rgba(255,63,164,${1 - (now - f.t) / 2500})`; ctx.lineWidth = Math.max(2, cell / 5);
    ctx.strokeRect(f.x * cell + 1, f.y * cell + 1, cell - 2, cell - 2);
  }
  for (const [x, y, c] of pending) {
    ctx.fillStyle = c === "." ? (dark ? "#2a2721" : "#fbfaf7") : S.palette[c];
    ctx.fillRect(x * cell, y * cell, cell, cell);
    ctx.strokeStyle = "#2f6fdf"; ctx.lineWidth = 2; ctx.strokeRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
  }
  if (hover) { ctx.strokeStyle = dark ? "#fff" : "#000"; ctx.lineWidth = 1; ctx.strokeRect(hover[0] * cell + .5, hover[1] * cell + .5, cell - 1, cell - 1); }
}

function cellAt(ev) {
  const r = cv.getBoundingClientRect();
  return [Math.floor((ev.clientX - r.left) / r.width * S.width), Math.floor((ev.clientY - r.top) / r.height * S.height)];
}
cv.onmousemove = ev => { if (!S) return; hover = cellAt(ev); $("hover").textContent = `x ${hover[0]}  y ${hover[1]}`; draw(); };
cv.onmouseleave = () => { hover = null; $("hover").textContent = ""; draw(); };
cv.onclick = ev => {
  const [x, y] = cellAt(ev), i = pending.findIndex(p => p[0] === x && p[1] === y);
  if (i >= 0) pending.splice(i, 1);
  else if (pending.length < S.pixels_per_turn) pending.push([x, y, color]);
  $("pending").textContent = pending.length; draw();
};

function myName() {
  const n = $("name").value.trim();
  if (!n) { $("err").textContent = "type a name first"; throw new Error("no name"); }
  try { localStorage.setItem("ourstory-name", n); } catch (e) {}
  return n;
}
async function act(fn) { $("err").textContent = ""; try { await fn(); await refresh(); } catch (e) { if (e.message !== "no name") $("err").textContent = e.message; } }
$("send").onclick = () => act(async () => { await api("/api/place", { name: myName(), pixels: pending }); pending = []; $("pending").textContent = 0; });
$("clear").onclick = () => { pending = []; $("pending").textContent = 0; draw(); };
$("done").onclick = () => act(() => api("/api/done", { name: myName() }));
const say = () => act(async () => { const t = $("say").value.trim(); if (!t) return; await api("/api/say", { name: myName(), text: t }); $("say").value = ""; });
$("sayBtn").onclick = say; $("say").onkeydown = e => { if (e.key === "Enter") say(); };

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }

function render() {
  $("turn").textContent = S.turn; $("left").textContent = S.seconds_left; $("ppt").textContent = S.pixels_per_turn;
  const names = Object.keys(S.players);
  $("players").innerHTML = names.length ? names.map(n => {
    const p = S.players[n], pct = p.done ? 100 : 100 * p.used / S.pixels_per_turn;
    return `<div class="player"><span>${esc(n)}</span><span class="stat">${p.done ? "done" : `${p.used}/${S.pixels_per_turn}`}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  }).join("") : `<span class="stat">nobody yet</span>`;
  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  log.innerHTML = S.log.filter(e => e.kind !== "done").map(e => {
    if (e.kind === "turn") return `<div class="ev turn">— ${esc(e.text)} —</div>`;
    const dots = e.pixels.length ? `<span class="dots">${e.pixels.slice(0, 16).map(p => `<i style="background:${S.palette[p[2]] || "transparent"};outline:1px solid var(--line)"></i>`).join("")}</span>` : "";
    const verb = e.kind === "place" ? `placed ${e.pixels.length}` : e.kind === "join" ? "joined" : "";
    return `<div class="ev"><span class="who">${esc(e.who)}</span> <span class="meta">t${e.turn} ${verb}</span>${dots}${e.text && e.kind !== "join" ? `<div>${esc(e.text)}</div>` : ""}</div>`;
  }).join("");
  if (atBottom) log.scrollTop = log.scrollHeight;
  draw();
}

async function refresh() {
  const prev = S; S = await api("/api/state");
  if (!prev) buildPalette();
  const t = performance.now();
  if (prev) for (const e of S.log) if (e.t > (prev.log.at(-1)?.t || 0)) for (const [x, y] of e.pixels) flashes.push({ x, y, t });
  render();
}
refresh(); setInterval(() => refresh().catch(() => {}), 1000);
(function loop() { if (flashes.length) draw(); requestAnimationFrame(loop); })();
addEventListener("resize", draw);
</script>
</body>
</html>
