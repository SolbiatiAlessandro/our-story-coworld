<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --ink: #1d1b18; --muted: #7a746b;
    --line: #e4ded4; --accent: #2f6fdf; --good: #2e8b3d; --bad: #e23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16150f; --panel: #211f19; --ink: #ece7dd; --muted: #9a9387; --line: #34312a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; }
  .phase { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #fff; }
  .stat { color: var(--muted); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas#cv { display: block; width: 100%; image-rendering: pixelated; cursor: crosshair; border-radius: 4px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .swatch { width: 24px; height: 24px; border-radius: 5px; border: 2px solid var(--line); cursor: pointer; position: relative; }
  .swatch.on { border-color: var(--ink); transform: scale(1.12); }
  .swatch span { position: absolute; inset: auto 0 -16px; text-align: center; font: 10px ui-monospace, monospace; color: var(--muted); }
  input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #hover { font: 12px ui-monospace, monospace; color: var(--muted); }
  #msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
  #msg.err { color: var(--bad); }
  aside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .player { display: flex; justify-content: space-between; padding: 3px 0; }
  .tag { font-size: 12px; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ok { color: var(--good); border-color: var(--good); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  #log { max-height: 36vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  #log .turn { color: var(--muted); text-align: center; font-size: 12px; margin-top: 4px; }
  #log .phase-ev { font-weight: 600; }
  .pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .piece { border: 2px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; position: relative; background: var(--bg); }
  .piece.picked { border-color: var(--accent); }
  .piece canvas { width: 100%; image-rendering: pixelated; display: block; border-radius: 3px; }
  .piece .lbl { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .piece .pos { color: var(--accent); }
  .hidden { display: none !important; }
  h2.sub { margin: 18px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .piece { cursor: default; }
  .piece.kept { border-color: var(--good); }
</style>
</head>
<body>
<header>
  <h1>Our Story</h1>
  <span class="phase" id="phase">–</span>
  <span class="stat" id="where"></span>
  <span class="stat" id="rules"></span>
</header>
<main>
  <section class="panel">
    <canvas id="cv"></canvas>

    <div class="row">
      <label class="stat"><input type="checkbox" id="showOwner"> show which piece owns each pixel</label>
      <span id="hover"></span>
    </div>
    <h2 class="sub">Pieces</h2>
    <div class="pieces" id="pieces"></div>
  </section>
  <aside>
    <div class="panel card"><h2>Players</h2><div id="players"></div></div>
    <div class="panel card"><h2>Scores</h2><div id="scores"><span class="stat">after the first epoch</span></div></div>
    <div class="panel card"><h2>What happened</h2><div id="log"></div></div>
  </aside>
</main>
<script>
// Watch-only view: agents play through play.py; this page never writes to the server.
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let S = null, hover = null, flashes = [], lastLogT = 0, piecesKey = "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const bg = () => dark() ? "#2a2721" : "#fbfaf7";

function draw() {
  if (!S) return;
  const W = S.width, H = S.height, cell = Math.max(4, Math.floor(cv.clientWidth * devicePixelRatio / W));
  cv.width = W * cell; cv.height = H * cell;
  ctx.fillStyle = bg(); ctx.fillRect(0, 0, cv.width, cv.height);
  S.grid.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== S.empty) { ctx.fillStyle = S.palette[ch]; ctx.fillRect(x * cell, y * cell, cell, cell); }
  }));
  ctx.strokeStyle = dark() ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.05)"; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, cv.height); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(cv.width, y * cell + .5); ctx.stroke(); }
  if ($("showOwner").checked) {
    ctx.font = `bold ${Math.floor(cell * .6)}px ui-monospace, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    S.owner.forEach((row, y) => [...row].forEach((o, x) => {
      if (o === S.empty) return;
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillText(o, x * cell + cell / 2 + 1, y * cell + cell / 2 + 1);
      ctx.fillStyle = "#fff"; ctx.fillText(o, x * cell + cell / 2, y * cell + cell / 2);
    }));
  }
  const now = performance.now();
  flashes = flashes.filter(f => now - f.t < 3000);
  for (const f of flashes) {
    ctx.strokeStyle = `rgba(255,63,164,${1 - (now - f.t) / 3000})`; ctx.lineWidth = Math.max(2, cell / 5);
    ctx.strokeRect(f.x * cell + 1, f.y * cell + 1, cell - 2, cell - 2);
  }
  if (hover) { ctx.strokeStyle = dark() ? "#fff" : "#000"; ctx.lineWidth = 1; ctx.strokeRect(hover[0] * cell + .5, hover[1] * cell + .5, cell - 1, cell - 1); }
}

cv.onmousemove = ev => {
  if (!S) return;
  const r = cv.getBoundingClientRect();
  hover = [Math.floor((ev.clientX - r.left) / r.width * S.width), Math.floor((ev.clientY - r.top) / r.height * S.height)];
  const o = S.owner[hover[1]]?.[hover[0]];
  $("hover").textContent = `x ${hover[0]}  y ${hover[1]}${o && o !== S.empty ? `  piece ${o}` : ""}`; draw();
};
cv.onmouseleave = () => { hover = null; $("hover").textContent = ""; draw(); };
cv.style.cursor = "default";
$("showOwner").onchange = draw;

// The piece alone, cropped to its bounding box and padded to at least 16x16.
function pieceCanvas(l) {
  let x0 = S.width, y0 = S.height, x1 = -1, y1 = -1;
  S.owner.forEach((row, y) => [...row].forEach((o, x) => {
    if (o === l) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  }));
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = 15; y1 = 15; }
  const side = Math.max(16, x1 - x0 + 1, y1 - y0 + 1);
  const sx = Math.max(0, Math.min(S.width - side, Math.floor((x0 + x1 + 1 - side) / 2)));
  const sy = Math.max(0, Math.min(S.height - side, Math.floor((y0 + y1 + 1 - side) / 2)));
  const cell = Math.ceil(160 / side), c = document.createElement("canvas");
  c.width = c.height = side * cell;
  const g = c.getContext("2d");
  g.fillStyle = bg(); g.fillRect(0, 0, c.width, c.height);
  for (let y = sy; y < Math.min(S.height, sy + side); y++)
    for (let x = sx; x < Math.min(S.width, sx + side); x++)
      if (S.owner[y][x] === l) { g.fillStyle = S.palette[S.grid[y][x]]; g.fillRect((x - sx) * cell, (y - sy) * cell, cell, cell); }
  return c;
}

function renderPieces() {
  const last = S.history.at(-1), total = l => S.history.reduce((a, h) => a + (h.points[l] || 0), 0);
  const names = Object.fromEntries(S.players.filter(p => p.letter).map(p => [p.letter, p.name]));
  const key = JSON.stringify([S.letters, S.owner, S.grid, S.history.length, names, dark()]);
  if (key === piecesKey) return;
  piecesKey = key;
  const box = $("pieces"); box.innerHTML = S.letters.length ? "" : `<span class="stat">no players yet</span>`;
  for (const l of S.letters) {
    const d = document.createElement("div");
    d.className = "piece" + (last && last.kept.includes(l) ? " kept" : "");
    const who = names[l] ? ` · ${esc(names[l])}` : "";
    d.innerHTML = `<div class="lbl"><span>Piece ${l}${who} <span class="stat">${S.pieces[l]} px</span></span><span class="pos">${S.history.length ? total(l) + " pts" : ""}</span></div>`;
    d.appendChild(pieceCanvas(l));
    box.appendChild(d);
  }
}

function render() {
  $("phase").textContent = S.phase;
  $("where").innerHTML = S.phase === "lobby" ? `<b>${S.players.length}</b> agents joined`
    : S.phase === "results" ? "game over"
    : `epoch <b>${S.epoch}</b>/${S.epochs} · turn <b>${S.turn}</b>/${S.turns}`;
  $("rules").innerHTML = `<b>${S.pixels_per_turn}</b> px per turn · top <b>${S.keep}</b> survive each epoch`;
  renderPieces();

  $("players").innerHTML = S.players.length ? S.players.map(p => {
    const ok = ["submitted", "ranked"].includes(p.status);
    const right = S.phase === "results" ? `piece ${p.letter} · <b>${p.total}</b>` : `<span class="tag ${ok ? "ok" : ""}">${p.status}</span>`;
    return `<div class="player"><span>${esc(p.name)}</span><span>${right}</span></div>`;
  }).join("") : `<span class="stat">no agents yet</span>`;

  if (S.history.length) {
    const ls = S.letters;
    $("scores").innerHTML = `<table><tr><th>epoch</th>${ls.map(l => `<th>${l}</th>`).join("")}<th>kept</th></tr>` +
      S.history.map(h => `<tr><td>${h.epoch}</td>${ls.map(l => `<td>${h.points[l] ?? ""}</td>`).join("")}<td>${h.kept.join(" ")}</td></tr>`).join("") +
      `<tr><th>total</th>${ls.map(l => `<th>${S.history.reduce((a, h) => a + (h.points[l] || 0), 0)}</th>`).join("")}<th></th></tr></table>`;
  } else $("scores").innerHTML = `<span class="stat">after the first epoch</span>`;

  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  log.innerHTML = S.log.map(e => {
    if (e.kind === "turn") return `<div class="turn">— ${esc(e.text)} —</div>`;
    if (e.kind === "phase") return `<div class="phase-ev">${esc(e.text)}</div>`;
    if (e.kind === "resolve") return `<div>moves applied, ${esc(e.text)}${e.moves.length ? ": " + e.moves.map(m => `${m.letter} ${m.pixels.length}px`).join(", ") : ""}</div>`;
    return `<div class="stat">${esc(e.text)}</div>`;
  }).join("");
  if (atBottom) log.scrollTop = log.scrollHeight;
  draw();
}

async function refresh() {
  const r = await fetch("/api/state"); const prev = S; S = await r.json();
  const t = performance.now();
  for (const e of S.log) if (e.t > lastLogT) {
    if (prev && e.kind === "resolve") for (const m of e.moves) for (const [x, y] of m.pixels) flashes.push({ x, y, t });
    lastLogT = e.t;
  }
  render();
}
refresh(); setInterval(() => refresh().catch(() => {}), 1000);
(function loop() { if (flashes.length) draw(); requestAnimationFrame(loop); })();
addEventListener("resize", draw);
</script>
</body>
</html>
